# macpro-thermald configuration for the MacPro7,1 (W-3265, 580X + W6900X).
# Fans use the 1-based sysfs numbers: fan1 = SMC F0, fan2..4 = F1..F3.
#
# How targets are chosen: every zone takes the HIGHEST rpm demanded by any of
# its sources (piecewise-linear curve: [temp_C, rpm]). A source whose
# temperature reaches `alarm` sends ALL fans to max. Sources marked
# critical=true also trigger that if their sensors vanish.
#
# Provenance: Apple's own curve could not be recovered. In a macOS test (2026-11-08,
# CPU 190 W, W6900X + 580X loaded, 620 W system, ~3 min per phase) Apple's firmware
# never raised any fan: F0..F3 stayed at 500/606/545/501 rpm while the hottest SMC
# sensors read 72-73 C. So these curves are OURS: chip limits plus a margin, and
# they start ramping earlier than Apple's firmware does. Edit freely.
#
# 2026-11-15: limits/curves retuned (handoff section 5 "Proposed config"): every curve
# reaches max rpm >=10 C below its hardware limit; every alarm >=4-5 C below it.
# Previous version: previous-20261115/macpro-thermald.conf (and /etc/*.bak-20261115).
# macOS 1 h W6900X test (11-15): Apple's SMC holds the die ~80 C at ~900-1000 rpm on F1;
# under Linux the SMC loop does not engage, so this daemon must stay in charge.

[general]
poll_s = 2.0              # control loop period
verify_settle_s = 1.5     # read back what we wrote at least this often
down_rpm_per_s = 25.0     # ramp-down slew; ramp-up is immediate
sensor_fail_limit = 3     # consecutive misses on a critical sensor => all fans max
mismatch_limit = 5        # consecutive failed read-backs => all fans max

# ---- FRONT: F1+F2+F3 (fan2..4), one shared target. Cools CPU heatsink and both MPX bays.
# Idle floor 550 sits between Apple's idle targets for these fans (500/550/605).
[zones.front]
fans = [2, 3, 4]
floor_rpm = 550

[[zones.front.sources]]
name = "cpu package"
kind = "cpu"                       # coretemp "Package id N"
curve = [[60, 550], [70, 900], [80, 1500], [88, 2500]]
alarm = 94
expect = 1

[[zones.front.sources]]
name = "gpu edge (all AMD GPUs)"   # Polaris 580X only has edge; Navi21 has edge too
kind = "gpu"
sensor = "edge"
curve = [[55, 550], [65, 1000], [75, 1800], [82, 2500]]
alarm = 95
expect = 2                         # 580X + W6900X

[[zones.front.sources]]
name = "gpu junction (Navi21)"
kind = "gpu"
sensor = "junction"
curve = [[60, 550], [70, 1000], [80, 1700], [88, 2500]]
alarm = 100
expect = 1                         # W6900X

[[zones.front.sources]]
name = "gpu memory (Navi21)"
kind = "gpu"
sensor = "mem"
curve = [[70, 550], [90, 1500], [100, 2500]]
alarm = 100
expect = 1

# SMC sensors are matched by the 4-char key in the label. macsmc_hwmon (t2linux 7.3)
# labels read "CPU Proximity Temperature (TC0P)"; the key in parentheses is used.
# Keys absent from this kernel's driver table (TJ*, TS1*, TS2*, TC2P, TC3P: not exposed)
# are skipped with a warning. The 580X bay has no SMC sensor in the hwmon; it is covered
# by amdgpu edge above. "Relative" sensors (TCXR, TC0E, ...) read about -70 C and
# TC1F reads -127: never list them. Tp2h returns EOPNOTSUPP: not listed.
# Non-critical: nice to have, not required.
[[zones.front.sources]]
name = "smc mpx bay 1 (GPU 0 / W6900X)"
kind = "smc"
keys = ["TG0D", "TG0F", "TG1D", "TG1F", "TG0P", "TG1P", "TG2P", "TG3P", "TG4P"]
curve = [[65, 550], [80, 1500], [90, 2500]]
alarm = 95
critical = false

[[zones.front.sources]]
name = "smc cpu"
kind = "smc"
keys = ["TCXc", "TC0P", "TC1P"]
curve = [[60, 550], [75, 1300], [88, 2500]]
alarm = 95
critical = false

[[zones.front.sources]]
name = "smc pch"
kind = "smc"
keys = ["TPCD"]
curve = [[60, 550], [85, 2500]]
alarm = 95
critical = false

# ---- SIDE: F0 (fan1, the rear blower, 500-1200 rpm). Cools DIMMs, PSU, SSD/T2 area.
# Follows only the hottest of those, independent of the front fans.
[zones.side]
fans = [1]
floor_rpm = 500

[[zones.side.sources]]
name = "dimms"
kind = "smc"
keys = ["TM0P", "TM1P", "TM2P", "TM3P", "TM8P", "TMXP", "Tm0P", "Tm1P", "Tm2P"]
curve = [[45, 500], [60, 800], [75, 1200]]
alarm = 83
critical = false

[[zones.side.sources]]
name = "power supply"
kind = "smc"
keys = ["Tp0P", "Tp1P", "Tp2P", "Tp2F"]
curve = [[50, 500], [65, 800], [80, 1200]]
alarm = 85
critical = false

[[zones.side.sources]]
name = "flash / T2 area"
kind = "smc"
keys = ["TH0P", "TH0F", "TH0a", "TH0b", "TH0c", "TH0x", "TH0X"]
curve = [[50, 500], [62, 800], [72, 1200]]
alarm = 78
critical = false
